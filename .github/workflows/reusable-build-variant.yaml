name: Build Image

on:
  workflow_call:
    inputs:
      variant_name:
        description: Variant name used to locate the build context
        required: true
        type: string
      variant_image:
        description: Full image repository to build and push
        required: true
        type: string
    outputs:
      image:
        description: Full image name including tag
        value: ${{ jobs.build.outputs.image }}
      image_tag:
        description: Just the tag portion of the built manifest image
        value: ${{ jobs.manifest.outputs.image_tag }}

env:
  CACHE_TAG: ghcr.io/ultramarine-linux/shade/cache

jobs:
  build:
    outputs:
      image: ${{ env.IMAGE_TAG }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    runs-on: ${{ contains(matrix.arch, 'aarch64') && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}

    env:
      BUILD_PLATFORM: ${{ contains(matrix.arch, 'aarch64') && 'linux/arm64' || 'linux/amd64' }}
      BUILD_CONTEXT: shades/${{ inputs.variant_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Image Metadata
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5
        id: metadata
        with:
          images: ${{ inputs.variant_image }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch,suffix=-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=shades
          annotations: |
            org.opencontainers.image.licenses="CC-BY-SA-4.0 AND GPL-3.0-or-later AND MIT"

      - name: Login to GitHub Container Registry
        env:
          registry: ghcr.io
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login -u "${{ github.actor }}" --password-stdin "$registry"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login -u "${{ github.actor }}" --password-stdin "$registry"

      - name: Build architecture image
        shell: bash
        env:
          METADATA_TAGS: ${{ steps.metadata.outputs.tags }}
          METADATA_JSON: ${{ steps.metadata.outputs.json }}
        run: |
          FIRST_TAG=$(printf '%s\n' "$METADATA_TAGS" | head -n 1)
          echo "IMAGE_TAG=$FIRST_TAG" >> "$GITHUB_ENV"

          readarray -t LABEL_ARGS < <(printf '%s' "$METADATA_JSON" | jq -r '.labels | to_entries[] | "--label=" + .key + "=" + .value')
          readarray -t ANNOTATION_ARGS < <(printf '%s' "$METADATA_JSON" | jq -r '.annotations[]? | select(startswith("manifest:") | not) | "--annotation=" + .')

          sudo podman build \
            --platform "$BUILD_PLATFORM" \
            --layers=true \
            --cache-to ${{ env.CACHE_TAG }} \
            --cache-from ${{ env.CACHE_TAG }} \
            "${LABEL_ARGS[@]}" \
            "${ANNOTATION_ARGS[@]}" \
            -f "${BUILD_CONTEXT}/Containerfile" \
            -t "$FIRST_TAG" "$BUILD_CONTEXT"

      - name: Push to GHCR
        shell: bash
        run: |
          sudo podman push "$IMAGE_TAG"

      - name: Get digest
        id: digest
        shell: bash
        run: |
          DIGEST=$(sudo podman inspect --format '{{.Digest}}' "$IMAGE_TAG")
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Upload matrix outputs
        uses: cloudposse/github-action-matrix-outputs-write@ed06cf3a6bf23b8dce36d1cf0d63123885bb8375
        with:
          matrix-step-name: build
          matrix-key: ${{ matrix.arch }}
          outputs: |-
            digest: ${{ steps.digest.outputs.digest }}
            image: ${{ env.IMAGE_TAG }}

  manifest:
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    needs:
      - build
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_tag: ${{ steps.extract-tag.outputs.image_tag }}

    steps:
      - name: Read matrix outputs
        uses: cloudposse/github-action-matrix-outputs-read@33cac12fa9282a7230a418d859b93fdbc4f27b5a
        id: read
        with:
          matrix-step-name: build

      - name: Image Metadata
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5
        id: metadata
        with:
          images: ${{ inputs.variant_image }}
          flavor: |
            latest=auto
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
          annotations: |
            org.opencontainers.image.licenses="CC-BY-SA-4.0 AND GPL-3.0-or-later AND MIT"

      - name: Debug matrix outputs
        shell: bash
        run: |
          echo '${{ steps.read.outputs.result }}' | jq

      - name: Login to GitHub Container Registry
        env:
          registry: ghcr.io
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | sudo podman login -u "${{ github.actor }}" --password-stdin "$registry"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login -u "${{ github.actor }}" --password-stdin "$registry"

      - name: Extract image tag
        id: extract-tag
        shell: bash
        env:
          METADATA_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          FIRST_TAG=$(printf '%s\n' "$METADATA_TAGS" | head -n 1)
          # Strip the image name, keep only the tag
          IMAGE_TAG="${FIRST_TAG##*:}"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Create and push merged manifest
        shell: bash
        env:
          MATRIX_OUTPUTS: ${{ steps.read.outputs.result }}
          METADATA_TAGS: ${{ steps.metadata.outputs.tags }}
          METADATA_ANNOTATIONS: ${{ steps.metadata.outputs.annotations }}
        run: |
          AMD64_IMAGE=$(printf '%s' "$MATRIX_OUTPUTS" | jq -r '.image.x86_64')
          ARM64_IMAGE=$(printf '%s' "$MATRIX_OUTPUTS" | jq -r '.image.aarch64')
          FIRST_MANIFEST_TAG=$(printf '%s\n' "$METADATA_TAGS" | head -n 1)

          sudo podman manifest rm "$FIRST_MANIFEST_TAG" || true
          sudo podman manifest create "$FIRST_MANIFEST_TAG"
          sudo podman manifest add "$FIRST_MANIFEST_TAG" "docker://$AMD64_IMAGE"
          sudo podman manifest add "$FIRST_MANIFEST_TAG" "docker://$ARM64_IMAGE"

          :

          while IFS= read -r manifest_tag; do
            [ -n "$manifest_tag" ] || continue
            sudo podman manifest push --all "containers-storage:$FIRST_MANIFEST_TAG" "docker://$manifest_tag"
          done < <(printf '%s\n' "$METADATA_TAGS")
