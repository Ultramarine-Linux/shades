builder: dnf

import:
  - ../base/base.yaml
  - ../live/live.yaml
  - ../base/desktop.yaml
  - ../live/readymade.yaml
  - de-shade.yaml

distro: Ultramarine Linux 42 (DE Shade)

out_file: ultramarine-de-shade-42-live.iso

bootloader: grub

kernel_cmdline: "quiet rhgb"

iso:
  volume_id: UM-DE-Shade-Live

scripts:
  post:
    - id: de-shade-live
      name: Set up DE Shade Live
      file: ./de-shade-live.sh

dnf:
  releasever: 42
  exec: dnf4
