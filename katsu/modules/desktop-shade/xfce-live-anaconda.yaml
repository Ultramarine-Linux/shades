builder: dnf

import:
  - ../base/base.yaml
  - ../live/live.yaml
  - ../live/anaconda.yaml
  - DE.yaml

distro: Ultramarine Linux 43 (DE Shade)

out_file: ultramarine-DE-shade-43-live-anaconda.iso

bootloader: grub

kernel_cmdline: "quiet rhgb"

iso:
  volume_id: UM-DE-Shade-Live-Anaconda

scripts:
  post:
    - id: de-shade-live
      name: Set up DE Shade Live
      file: ./de-shade-live.sh

dnf:
  releasever: 43
  exec: dnf
